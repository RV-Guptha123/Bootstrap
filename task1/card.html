<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .profile-card {
            max-width: 500px;
            margin: 50px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .profile-header {
            background: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile-body {
            padding: 25px;
        }

        .info-item {
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #495057;
        }

        .value {
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container row">
    <div class="card profile-card col-4">

        <!-- Profile Header -->
        <div class="profile-header">
            <img src="shannu.jpg" alt="Profile Image" class="profile-img">
            <h3 class="mb-0">Mandapalli Shanmukha</h3>
        </div>

        <!-- Profile Details -->
        <div class="profile-body">

            <div class="info-item d-flex justify-content-between">
                <span class="label">Roll Number</span>
                <span class="value">23B81A6639</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Branch</span>
                <span class="value">CSE(AI-ML)</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Email</span>
                <span class="value">23b81a6646@cvr.ac.in</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Mobile Number</span>
                <span class="value">9876543210</span>
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-primary">
                    Edit Profile
                </button>
            </div>

        </div>
    </div>
    <div class="card profile-card col-4">

        <!-- Profile Header -->
        <div class="profile-header">
            <img src="shannu.jpg" alt="Profile Image" class="profile-img">
            <h3 class="mb-0">Mandapalli Shanmukha</h3>
        </div>

        <!-- Profile Details -->
        <div class="profile-body">

            <div class="info-item d-flex justify-content-between">
                <span class="label">Roll Number</span>
                <span class="value">23B81A6639</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Branch</span>
                <span class="value">CSE(AI-ML)</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Email</span>
                <span class="value">23b81a6646@cvr.ac.in</span>
            </div>

            <div class="info-item d-flex justify-content-between">
                <span class="label">Mobile Number</span>
                <span class="value">9876543210</span>
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-primary">
                    Edit Profile
                </button>
            </div>

        </div>
    </div>  
    
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
