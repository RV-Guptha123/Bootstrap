<div class="form-box">
    <h4 class="text-center mb-4">Registration Form</h4>

    <div class="row mb-3">
        <label class="col-4 col-form-label">Name</label>
        <div class="col-8">
            <input type="text" class="form-control form-control-sm">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-4 col-form-label">Roll No</label>
        <div class="col-8">
            <input type="text" class="form-control form-control-sm">
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-4 col-form-label">Email</label>
        <div class="col-8">
            <input type="email" class="form-control form-control-sm">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-4 col-form-label">Mobile No</label>
        <div class="col-8">
            <input type="text" class="form-control form-control-sm">
        </div>
    </div>
    <div class="row mb-3">
    <label class="col-4 col-form-label">Gender</label>

    <div class="col-8">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
            <label class="form-check-label" for="male">Male</label>
        </div>

        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
            <label class="form-check-label" for="female">Female</label>
        </div>
    </div>
    <div class="row mb-3">
    <label class="col-4 col-form-label">Branch</label>

    <div class="col-8">
        <select class="form-select form-select-sm">
            <option selected>Select Branch</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>IT</option>
        </select>
    </div>
    <div class="row mb-3">
        <label class="col-4 col-form-label">DOB</label>
        <div class="col-8">
            <input type="date" class="form-control form-control-sm">
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-4 col-form-label">Address</label>
        <div class="col-8">
            <input type="text" class="form-control form-control-sm">
        </div>
    </div>
    <div class="row mb-3">
    <label class="col-4 col-form-label">Upload Document</label>

    <div class="col-8">
        <input type="file" class="form-control form-control-sm">
    </div>
    </div>
    <div class="row mb-3">
    <div class="col-8">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">
                I agree to the Terms and Conditions
            </label>
        </div>
    </div>
    </div>
    <div>
        <p>already have an account?<a href="login.html">Login here</a></p>
    </div>
</div>
</div>

    <button class="btn btn-primary btn-sm w-100">Submit</button>
</div>
